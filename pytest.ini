[pytest]
testpaths = tests
markers =
    slow: re-runs an evaluation end to end; about ten minutes of CPU forward passes
# The slow marker is the three reproduction tests. They are excluded by default
# and run by `make check` and by CI's scheduled job, because a ten-minute wait
# on every `pytest` means nobody runs pytest.
addopts = -m "not slow" --strict-markers
filterwarnings =
    ignore::DeprecationWarning
